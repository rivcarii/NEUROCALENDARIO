name: Publicar web (carpeta docs)
# Cada push a main que cambie el código compila la web instalable y la deja en docs/, que GitHub Pages sirve con
#   Settings → Pages → Build and deployment → Source: «Deploy from a branch» → Branch: main / docs
# (la misma opción que usa Dulza). La versión incluye el SHA del commit: los teléfonos que la tienen instalada
# reciben el aviso «Hay una versión nueva de NeuroCalendario».
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'documentacion/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publicar-web
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      # Servicio de avisos (push-worker/). Secretos del repositorio: Settings → Secrets and variables → Actions.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck && npm test -- --forceExit
      - name: Probar el cifrado de los avisos
        run: cd push-worker && npm ci && npm test
      - name: Publicar el servicio de avisos (Cloudflare Workers)
        id: push
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          cd push-worker
          npx --yes wrangler@4 d1 execute neurocalendario-push --remote --file schema.sql
          npx --yes wrangler@4 deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Servicio de avisos: $url"
      - name: Compilar la web instalable en docs/
        env:
          EXPO_PUBLIC_PUSH_URL: ${{ steps.push.outputs.url }}
        run: EXPO_BASE_URL=/${{ github.event.repository.name }} ./scripts/build-web.sh docs
      - name: Guardar docs/ en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f docs
          if git diff --cached --quiet; then echo "Sin cambios"; else
            git commit -m "Publicar web (${GITHUB_SHA::7})"
            git push
          fi
