name: Publicar versión web (GitHub Pages)
# Cada push a main compila la app web instalable y la publica en https://<usuario>.github.io/NEUROCALENDARIO/
# La versión incluye el SHA del commit: los teléfonos que la tienen instalada reciben el aviso
# «Hay una versión nueva de NeuroCalendario» automáticamente.
# Paso único: Settings → Pages → Build and deployment → Source: «GitHub Actions».
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck && npm test -- --forceExit
      - name: Compilar la web instalable
        run: EXPO_BASE_URL=/${{ github.event.repository.name }} ./scripts/build-web.sh dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
